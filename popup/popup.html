<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CPI Pulse</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="header-left">
        <div class="pulse-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
        <span class="popup-title">CPI Pulse</span>
        <span class="popup-version" id="popupAppVersion" title="CPI Pulse Version">v1.0.0</span>
      </div>
      <span class="badge-live" id="popupLiveBadge">Live</span>
    </div>

    <!-- Dynamic Connected Tenant Row -->
    <div class="popup-tenant-status" id="popupTenantStatus" title="Active Tenant Origin">
      <span class="popup-tenant-dot amber" id="popupTenantDot"></span>
      <span class="popup-tenant-name" id="popupTenantName">Detecting Tenant...</span>
    </div>

    <!-- Live Dynamic KPIs (No hardcoded values) -->
    <div class="summary-kpis">
      <div class="kpi-mini">
        <span class="kpi-val green" id="popupKpiRunning">--</span>
        <span class="kpi-lbl">Running</span>
      </div>
      <div class="kpi-mini">
        <span class="kpi-val red" id="popupKpiErrors">--</span>
        <span class="kpi-lbl">Errors</span>
      </div>
      <div class="kpi-mini">
        <span class="kpi-val" id="popupKpiAvg">--</span>
        <span class="kpi-lbl">Avg Latency</span>
      </div>
    </div>

    <div class="popup-actions">
      <button class="btn-open-dashboard" id="btnOpenDashboard">
        Open Full Cockpit
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </button>
    </div>

    <div class="popup-footer">
      <span id="popupFooterText">SAP Cloud Integration</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
